# Local development and testing profile (runs in-memory PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:medikiosk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Gemini AI Configuration (inherits GEMINI_API_KEY if present)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}



