spring.application.name=medikiosk-backend
server.port=8080

# PostgreSQL Configuration via Environment Variables
# Format: DB_URL=jdbc:postgresql://<host>:<port>/<dbname>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medikiosk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}



